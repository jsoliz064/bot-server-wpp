
services:
  lamotico-bot:
    image: node:20.19.2-slim
    container_name: lamotico-bot
    hostname: lamotico-bot
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      sh -c "npm run prod"
    # ports:
    #   - "${PORT}:${PORT}"
    networks:
      - server-network

networks:
  server-network:
    external: true